bio: >-
  I am pursuing a Ph.D. in Artificial Intelligence at Yonsei University, advised by a
  professor of finance at the Yonsei School of Business. My research centers on empirical
  asset pricing, including factor investing, cross-asset predictability, and dynamic
  portfolio allocation, and uses machine learning methods to study financial markets.

